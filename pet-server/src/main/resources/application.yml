server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    druid:
      driver-class-name: ${pet.datasource.driver-class-name}
      url: jdbc:mysql://${pet.datasource.host}:${pet.datasource.port}/${pet.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${pet.datasource.username}
      password: ${pet.datasource.password}
  redis:
    host: ${pet.redis.host}
    port: ${pet.redis.port}
    password: ${pet.redis.password}
    database: ${pet.redis.database}
  mail:
    host: ${MAIL_HOST:smtp.qq.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:guest}
    password: ${RABBITMQ_PASSWORD:guest}

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.pet.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      pet:
        mapper: debug
        service: info
        controller: info

pet:
  jwt:
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: ${PET_ADMIN_JWT_SECRET:change-me-admin-jwt-secret}
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token
    user-secret-key: ${PET_USER_JWT_SECRET:change-me-user-jwt-secret}
    user-ttl: 7200000
    # 剩余有效期低于该值时自动续期
    refresh-threshold-ms: 1800000
    user-token-name: authentication
  login:
    # 验证码有效期（秒）
    code-ttl-seconds: 300
    # 是否真实发送邮件，未开启时验证码只写日志
    mail-enabled: ${PET_MAIL_ENABLED:false}
    # 开发环境是否把验证码返回给前端便于联调
    dev-return-code: ${PET_DEV_RETURN_CODE:true}
    # 发件人，默认与邮箱账号一致
    from: ${MAIL_USERNAME:}
  seckill:
    rabbit:
      exchange: pet.seckill.exchange
      queue: pet.seckill.order.queue
      routing-key: pet.seckill.order
    rate-limit:
      # 令牌桶容量
      capacity: 100
      # 每秒补充的令牌数
      permits-per-second: 50
  alioss:
    endpoint: ${pet.alioss.endpoint}
    access-key-id: ${pet.alioss.access-key-id}
    access-key-secret: ${pet.alioss.access-key-secret}
    bucket-name: ${pet.alioss.bucket-name}
  wechat:
    appid: ${pet.wechat.appid}
    secret: ${pet.wechat.secret}
