pet:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    host: localhost
    port: 3306
    database: pet_service
    username: ${PET_DB_USERNAME:root}
    password: ${PET_DB_PASSWORD:change-me}
  alioss:
    endpoint: ${ALIOSS_ENDPOINT:oss-cn-beijing.aliyuncs.com}
    access-key-id: ${ALIOSS_ACCESS_KEY_ID:your-access-key-id}
    access-key-secret: ${ALIOSS_ACCESS_KEY_SECRET:your-access-key-secret}
    bucket-name: ${ALIOSS_BUCKET_NAME:your-bucket-name}
  redis:
    host: ${PET_REDIS_HOST:localhost}
    port: ${PET_REDIS_PORT:6379}
    password: ${PET_REDIS_PASSWORD:}
    database: ${PET_REDIS_DATABASE:10}
  wechat:
    appid: ${WECHAT_APPID:your-appid}
    secret: ${WECHAT_SECRET:your-wechat-secret}
